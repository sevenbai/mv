<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>你準備好了嗎？（115級華山體育班）</title>
  <style>
    /* Reset and full-screen black stage */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    /* Video fills the viewport without cropping its content */
    #player {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    /* Overlay prompting the user to enable sound + true fullscreen */
    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
      cursor: pointer;
      z-index: 10;
      transition: opacity 0.4s ease;
    }

    #overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #overlay .icon {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      border: 2px solid rgba(255, 255, 255, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #overlay .icon::before {
      content: "";
      width: 0;
      height: 0;
      margin-left: 6px;
      border-style: solid;
      border-width: 16px 0 16px 26px;
      border-color: transparent transparent transparent #fff;
    }

    #overlay .hint {
      font-size: clamp(16px, 2.4vw, 22px);
      letter-spacing: 1px;
      opacity: 0.95;
    }

    /* End-of-playback replay button (icon only, bottom-right) */
    #replayBtn {
      position: fixed;
      right: 24px;
      bottom: 24px;
      width: 56px;
      height: 56px;
      padding: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      border: 2px solid rgba(255, 255, 255, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 20;
      transition: opacity 0.4s ease, background 0.2s ease;
    }

    #replayBtn:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    #replayBtn.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="stage">
    <video id="player" playsinline preload="auto" poster="cover.jpg">
      <source src="mv.mp4" type="video/mp4">
      你的瀏覽器不支援 HTML5 影片播放。
    </video>
  </div>

  <div id="overlay">
    <div class="icon"></div>
    <div class="hint">點擊播放</div>
  </div>

  <button id="replayBtn" class="hidden" type="button" aria-label="重新播放">
    <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
      <path fill="#fff" d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
    </svg>
  </button>

  <script>
    const player = document.getElementById("player");
    const overlay = document.getElementById("overlay");

    // On click: enter real fullscreen, then start playback with sound.
    const start = () => {
      const el = document.documentElement;
      const req = el.requestFullscreen
        || el.webkitRequestFullscreen
        || el.msRequestFullscreen;
      if (req) {
        try { req.call(el); } catch (e) { /* Fullscreen may be blocked; ignore. */ }
      }

      const p = player.play();
      if (p && typeof p.catch === "function") {
        p.catch(() => { /* Playback failed; leave overlay for another try. */ });
      }

      overlay.classList.add("hidden");
    };

    overlay.addEventListener("click", start, { once: true });

    const replayBtn = document.getElementById("replayBtn");

    // Show the replay button every time playback ends (repeatable, no `once`).
    player.addEventListener("ended", () => {
      replayBtn.classList.remove("hidden");
    });

    // Restart from the beginning, stay in fullscreen, hide the button.
    replayBtn.addEventListener("click", () => {
      replayBtn.classList.add("hidden");
      player.currentTime = 0;
      const p = player.play();
      if (p && typeof p.catch === "function") {
        // Playback failed; show the button again so the user can retry.
        p.catch(() => { replayBtn.classList.remove("hidden"); });
      }
    });
  </script>
</body>
</html>
