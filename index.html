<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>你準備好了嗎？（115級華山體育班）</title>
  <style>
    /* Reset and full-screen black stage */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    /* Video fills the viewport without cropping its content */
    #player {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    /* Overlay prompting the user to enable sound + true fullscreen */
    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
      cursor: pointer;
      z-index: 10;
      transition: opacity 0.4s ease;
    }

    #overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #overlay .icon {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      border: 2px solid rgba(255, 255, 255, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #overlay .icon::before {
      content: "";
      width: 0;
      height: 0;
      margin-left: 6px;
      border-style: solid;
      border-width: 16px 0 16px 26px;
      border-color: transparent transparent transparent #fff;
    }

    #overlay .hint {
      font-size: clamp(16px, 2.4vw, 22px);
      letter-spacing: 1px;
      opacity: 0.95;
    }
  </style>
</head>
<body>
  <div id="stage">
    <video id="player" playsinline preload="auto" poster="cover.jpg">
      <source src="你準備好了嗎？(115級華山體育班).mp4" type="video/mp4">
      你的瀏覽器不支援 HTML5 影片播放。
    </video>
  </div>

  <div id="overlay">
    <div class="icon"></div>
    <div class="hint">點擊播放</div>
  </div>

  <script>
    const player = document.getElementById("player");
    const overlay = document.getElementById("overlay");

    // On click: enter real fullscreen, then start playback with sound.
    const start = () => {
      const el = document.documentElement;
      const req = el.requestFullscreen
        || el.webkitRequestFullscreen
        || el.msRequestFullscreen;
      if (req) {
        try { req.call(el); } catch (e) { /* Fullscreen may be blocked; ignore. */ }
      }

      const p = player.play();
      if (p && typeof p.catch === "function") {
        p.catch(() => { /* Playback failed; leave overlay for another try. */ });
      }

      overlay.classList.add("hidden");
    };

    overlay.addEventListener("click", start, { once: true });
  </script>
</body>
</html>
